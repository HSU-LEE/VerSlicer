name: Orca Tools Tests

on:
  pull_request:
    paths:
      - 'src/dev-utils/**'
      - 'src/slic3r/GUI/OllamaAssistant/**'
      - 'src/slic3r/GUI/MakerWorld/**'
      - '.github/workflows/orca-tools-test.yml'
  workflow_dispatch:

jobs:
  orca-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        uses: ./.github/actions/apt-install-deps

      - name: Configure (ORCA_TOOLS)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DORCA_TOOLS=ON -DSLIC3R_ENC_CHECK=OFF

      - name: Build dev-utils tests
        run: |
          cmake --build build --target ollama_assistant_test ollama_pipeline_test makerworld_search_test -j4

      - name: Run dev-utils tests
        working-directory: build
        run: ctest -R 'ollama_assistant_test|ollama_pipeline_test|makerworld_search_test' --output-on-failure
